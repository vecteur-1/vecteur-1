<!-- static/images/default-cover.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="800" height="400" fill="#f8fafc"/>
  <rect width="800" height="400" fill="url(#grid)" opacity="0.5"/>
  <path d="M0 400 L 800 400 L 800 250 Q 600 350 400 200 T 0 250 Z" fill="#e0e7ff" opacity="0.7"/>
  <path d="M0 400 L 800 400 L 800 300 Q 600 200 400 300 T 0 350 Z" fill="#4f46e5" opacity="0.1"/>
  <circle cx="400" cy="200" r="40" fill="#4f46e5" opacity="0.9"/>
  <circle cx="400" cy="200" r="60" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="8 4" opacity="0.5"/>
  <circle cx="400" cy="200" r="80" fill="none" stroke="#4f46e5" stroke-width="1" opacity="0.2"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>
</svg>
